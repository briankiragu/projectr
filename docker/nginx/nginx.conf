worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Upstreams
    upstream admin {
        server admin:8055;
    }

    upstream search {
        server search:7700;
    }

    upstream sync {
        server meilisync-admin:8000;
    }

    # HTTP → HTTPS redirect (+ ACME challenge for certbot)
    server {
        listen          80;
        listen          [::]:80 ipv6only=on;

        server_name     admin.thevoicecommunity.org;
        server_tokens   off;

        location /.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen          443 ssl http2;
        listen          [::]:443 ssl http2 ipv6only=on;

        server_name     admin.thevoicecommunity.org;
        server_tokens   off;

        # SSL certificates (managed by certbot)
        ssl_certificate     /etc/nginx/ssl/live/admin.thevoicecommunity.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/admin.thevoicecommunity.org/privkey.pem;

        # SSL hardening
        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
        ssl_prefer_server_ciphers   on;
        ssl_session_cache           shared:SSL:10m;
        ssl_session_timeout         10m;

        # add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        location /meilisync/ {
            proxy_pass            http://sync/;

            proxy_set_header      Host $host;
            proxy_set_header      X-Real-IP $remote_addr;
            proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
        }

        location /meilisearch/ {
            proxy_pass          http://search/;

            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass          http://admin;

            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version    1.1;
            proxy_set_header      Upgrade $http_upgrade;
            proxy_set_header      Connection "upgrade";
            proxy_read_timeout    86400;

            proxy_buffer_size         128k;
            proxy_buffers             4 256k;
            proxy_busy_buffers_size   256k;
        }
    }
}
